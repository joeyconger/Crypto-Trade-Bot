# Known exchange / bridge / market-maker wallet addresses to exclude from
# on-chain entry-trigger candidates ("wallet not tagged exchange/bridge/
# market-maker").
#
# This starts EMPTY on purpose. There's no reliable free API that labels
# Solana wallets this way, and hot wallets for exchanges/bridges rotate over
# time -- shipping a guessed or stale list would be worse than an empty one,
# since a wrong address gives false confidence in a safety-relevant filter.
# Populate this yourself from a source you trust (e.g. Solscan's labeled
# addresses, a Helius Labels API if you're on a tier that has it, or your own
# observation of which wallets show up as exchange/bridge/MM activity on your
# watchlist tokens) and keep it current.
#
# tag must be one of: exchange | bridge | market_maker
wallets: []
#  - address: <solana address>
#    tag: exchange
#    note: optional -- why you tagged it, and when you verified it
