# Vibes & Fibs watchlist
#
# Each token gets its own strategy parameters. Add/remove tokens here without
# touching any code -- the bot reloads this file at the start of each poll cycle.
#
# Entry logic: TWO required gates, not one.
#   Conditions 1-6 (technical): trend + fib/structural confluence + RSI
#     momentum + volume + a confirmed candle close. This narrows WHEN to
#     look -- entry TIMING, not sufficient evidence on its own.
#   Condition 7 (on-chain confluence): real wallets accumulating real size.
#     REQUIRED. A technical setup with no qualifying on-chain confirmation
#     never opens a position -- there is no technical-only path.
# Two ways Condition 7 can fire, sized differently (see risk.riskPctPerTrade
# vs riskPctPerTradeTierB below):
#   Tier A: >=2 mutually-unconnected confirming wallets.
#   Tier B: exactly 1 wallet, but it must clear a raised bar (neutral+
#     reputation, >=soloConfirmationMinPriorTrades prior trades) to
#     compensate for having no independent corroboration.

# "top_traded": trade the top topTradedCount tokens by 24h volume,
# re-selected every refreshIntervalHours, each using the defaultStrategy
# below (100 tokens can't realistically get individually hand-tuned
# params). The `tokens` list below still rides along as an always-included
# pin list on top of this. Switch mode to "static" to trade only the
# pinned `tokens` list and ignore topTradedCount entirely.
watchlistSource:
  mode: top_traded
  topTradedCount: 100
  refreshIntervalHours: 24
  # Symbols excluded from dynamic selection (case-insensitive). USD-pegged
  # stablecoins routinely rank high by volume on Solana DEXs but are
  # meaningless targets for a fib-retracement/momentum strategy -- a pegged
  # asset's price barely moves, so the technical conditions have nothing to
  # fire on. Matched by symbol, not address (a coincidentally-named token
  # slipping through this list, or a real stablecoin under an unlisted
  # ticker slipping past it, is low-stakes either way -- unlike guessing an
  # actual token mint address, which this project avoids everywhere it's
  # safety-relevant). Add to this list freely.
  excludedSymbols:
    [USDT, USDC, DAI, USDE, FDUSD, TUSD, USDD, PYUSD, USDS, USDH, UXD, USDY, BUSD, GUSD, USDP, EURC]
  # Re-checked again at entry time (not just here at selection time) --
  # see engine/loop.ts's considerNewEntry. A pool can thin out well before
  # the watchlist next refreshes.
  minLiquidityUsd: 50000
  # Pools younger than this are excluded from the dynamic selection
  # entirely -- the most manipulable, least statistically meaningful class
  # of token, via GeckoTerminal's pool_created_at (best-effort field name,
  # see data/geckoterminal.ts).
  minTokenAgeHours: 24

# Shared strategy for the dynamic top-100 selection. Same params as the
# pinned BONK/WIF below except swingLookbackHours and
# technicalRefreshIntervalMinutes (see their own comments).
defaultStrategy:
  fibPivotWindow: 2
  goldenPocketZonePct: 4
  # 24h (not 96h like the pinned tokens below) puts this in the 15-minute
  # candle bucket instead of 1-hour (see pickTimeframe in
  # data/geckoterminal.ts) -- the trend/RSI/volume checks still need the
  # same 14-15 real candles, just packed into ~3.5-3.75h of pool age instead
  # of ~15h. The dynamic top-100 pulls in viral, sometimes hours-old meme
  # coins; a 96h requirement was rejecting most of them purely for being
  # "too new," not for lacking a real setup. Established tokens like the
  # pinned BONK/WIF don't need this -- they keep the longer 96h/1h-candle
  # lookback since they have years of history either way.
  swingLookbackHours: 24

  trendSmaPeriod: 15
  chopLookbackPeriods: 15
  chopMaxCrossings: 9

  rsiPeriod: 14
  rsiMidline: 65
  rsiOverboughtCeiling: 85

  volumeAvgPeriod: 15
  volumeConfirmationMultiplier: 1.0

  # --- on-chain confluence (Condition 7, REQUIRED) ---
  minBuyPctOfLiquidity: 1.5 # buy must be >= this % of current pool liquidity to count as real size -- a flat $ bar is trivial on a $5M pool and unreachable on a $60k one
  maxBuyPctOfLiquidity: 3 # buys above this % are treated as manipulation risk, not conviction
  minWalletAgeDays: 7
  minWalletPriorTrades: 1 # base per-wallet bar -- applies to every candidate, including Tier A wallets
  soloConfirmationMinPriorTrades: 3 # raised bar a LONE (Tier B) confirming wallet must clear
  confirmationWindowHours: 12 # real accumulation rarely clusters into a tight burst
  minConfirmingWallets: 1 # 1 permits Tier B to fire on its own merit; set to 2 to require Tier A always

  atrPeriod: 14
  stopAtrMultiplier: 1

  extensionRatio1: 1.272
  extensionRatio2: 1.618
  scaleOutPct1: 33
  scaleOutPct2: 33

  timeExitHours: 48

  # How often (minutes) a token with no open position gets re-scanned.
  # Matches the 15-minute candle interval above -- Condition 6 (confirmed
  # close) is a per-candle event, so scanning slower than one candle period
  # means missing most valid setups regardless of how permissive every
  # other filter is. engine/loop.ts spreads this across the whole window
  # instead of bursting, to stay well under the data provider's rate limit
  # -- see the "watchlist cadence" log line at runtime.
  technicalRefreshIntervalMinutes: 15

tokens:
  - symbol: BONK
    address: DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263
    enabled: true

    # --- fib zone + structural confluence ---
    fibPivotWindow: 2 # candles required on each side to confirm a swing pivot -- lower = fresher/faster-confirming swings
    goldenPocketZonePct: 4 # price must be within this % of the 0.5/0.618 retracement, and that level within this % of a prior pivot
    swingLookbackHours: 96 # how much price history to pull for pivot/indicator calculation

    # --- trend context filter (don't fight the trend) ---
    # A 50-period SMA on hourly candles is a ~2-day lookback -- too slow to
    # react to a meme coin's actual recent structure. 15 periods (~15h) tracks
    # it much more responsively while still refusing to buy a real downtrend.
    trendSmaPeriod: 15
    chopLookbackPeriods: 15 # window to count MA crossings in
    chopMaxCrossings: 9 # this many crossings in the window means "too choppy," skip -- meme coins whipsaw more than a stricter threshold assumes

    # --- momentum confirmation (buy the reaction, not the touch) ---
    rsiPeriod: 14
    rsiMidline: 65 # RSI must be below this and rising
    rsiOverboughtCeiling: 85 # RSI above this means chasing, not catching a pullback

    # --- volume confirmation on the reaction candle ---
    volumeAvgPeriod: 15
    volumeConfirmationMultiplier: 1.0

    # --- on-chain confluence (Condition 7, REQUIRED) ---
    minBuyPctOfLiquidity: 1.5
    maxBuyPctOfLiquidity: 3
    minWalletAgeDays: 7
    minWalletPriorTrades: 1
    soloConfirmationMinPriorTrades: 3
    confirmationWindowHours: 12
    minConfirmingWallets: 1

    # --- ATR-based stop ---
    atrPeriod: 14
    stopAtrMultiplier: 1 # initial stop = swing low - (this x ATR)

    # --- scaled take-profit ---
    extensionRatio1: 1.272
    extensionRatio2: 1.618
    scaleOutPct1: 33 # closed at extensionRatio1
    scaleOutPct2: 33 # closed at extensionRatio2 -- remainder (34%) is the uncapped runner

    # --- time-based exit (unscaled portion only -- ignored once scaleOutPct1 has fired) ---
    timeExitHours: 48

    # Pinned tokens are few enough that scanning every poll cycle costs
    # nothing meaningful against the rate limit -- keep them responsive.
    technicalRefreshIntervalMinutes: 5

  - symbol: WIF
    address: EKpQGSJtjMFqKZ9KQanSqYXRcF8fBopzLHYxdM65zcjm
    enabled: true

    fibPivotWindow: 2
    goldenPocketZonePct: 4
    swingLookbackHours: 96

    trendSmaPeriod: 15
    chopLookbackPeriods: 15
    chopMaxCrossings: 9

    rsiPeriod: 14
    rsiMidline: 65
    rsiOverboughtCeiling: 85

    volumeAvgPeriod: 15
    volumeConfirmationMultiplier: 1.0

    minBuyPctOfLiquidity: 1.5
    maxBuyPctOfLiquidity: 3
    minWalletAgeDays: 7
    minWalletPriorTrades: 1
    soloConfirmationMinPriorTrades: 3
    confirmationWindowHours: 12
    minConfirmingWallets: 1

    atrPeriod: 14
    stopAtrMultiplier: 1

    extensionRatio1: 1.272
    extensionRatio2: 1.618
    scaleOutPct1: 33
    scaleOutPct2: 33

    timeExitHours: 48
    technicalRefreshIntervalMinutes: 5

# Account-level risk management -- applies across all tokens/positions.
risk:
  riskPctPerTrade: 1 # % of account risked per trade on a Tier A (2+ wallet) entry; position size = (account x this%) / (entry - stop)
  riskPctPerTradeTierB: 0.5 # % risked on a Tier B (single-wallet, raised-bar) entry -- smaller bet on weaker evidence, not a pass/fail cutoff
  maxPositionSizePct: 10 # hard ceiling on any single position, regardless of stop distance
  dailyLossLimitPct: 3 # halt new entries for the rest of the UTC day
  weeklyLossLimitPct: 8 # halt entirely -- sticky, no auto-resume, needs manual review
  consecutiveLossLimit: 4 # halt entirely after this many losses in a row -- sticky, no auto-resume
  maxConcurrentPositions: 6 # hard cap on simultaneously open positions -- checked before every new entry, independent of the daily/weekly circuit breakers
