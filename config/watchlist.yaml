# Vibes & Fibs watchlist
#
# Each token gets its own strategy parameters. Add/remove tokens here without
# touching any code -- the bot reloads this file at the start of each poll cycle.
#
# Entry logic: the TECHNICAL trigger is the entry gate -- trend + fib/
# structural confluence + RSI momentum + volume + a confirmed candle close,
# all required, no big wallet needed. On-chain wallet confirmation is
# evaluated too, but purely as optional confluence: logged against the trade
# and folded into its reason when present, never required to fire an entry.

# "top_traded": trade the top topTradedCount tokens by 24h volume from
# Birdeye, re-selected every refreshIntervalHours, each using the
# defaultStrategy below (100 tokens can't realistically get individually
# hand-tuned params). The `tokens` list below still rides along as an
# always-included pin list on top of this. Switch mode to "static" to trade
# only the pinned `tokens` list and ignore topTradedCount entirely.
watchlistSource:
  mode: top_traded
  topTradedCount: 100
  refreshIntervalHours: 24
  minLiquidityUsd: 50000

# Shared strategy for the dynamic top-100 selection. Same params as the
# pinned BONK/WIF below, except technicalRefreshIntervalMinutes: with 100
# tokens, scanning each one on every poll cycle would blow past Birdeye's
# free-tier budget fast -- see engine/loop.ts's due-token throttle. 240 (4h)
# keeps ~100 tokens at roughly 20k Birdeye calls/month; tighten it if your
# actual usage (check the Birdeye dashboard after a day or two) has headroom,
# or loosen it if it doesn't.
defaultStrategy:
  fibPivotWindow: 3
  goldenPocketZonePct: 2.5
  swingLookbackHours: 96

  trendSmaPeriod: 20
  chopLookbackPeriods: 15
  chopMaxCrossings: 6

  rsiPeriod: 14
  rsiMidline: 60
  rsiOverboughtCeiling: 78

  volumeAvgPeriod: 15
  volumeConfirmationMultiplier: 1.2

  minBuyUsd: 5000
  maxBuyPctOfLiquidity: 3
  minWalletAgeDays: 14
  minWalletPriorTrades: 1
  confirmationWindowHours: 4
  minConfirmingWallets: 2

  atrPeriod: 14
  stopAtrMultiplier: 1

  extensionRatio1: 1.272
  extensionRatio2: 1.618
  scaleOutPct1: 33
  scaleOutPct2: 33

  timeExitHours: 48
  technicalRefreshIntervalMinutes: 240

tokens:
  - symbol: BONK
    address: DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263
    enabled: true

    # --- fib zone + structural confluence ---
    fibPivotWindow: 3 # candles required on each side to confirm a swing pivot -- lower = fresher/faster-confirming swings
    goldenPocketZonePct: 2.5 # price must be within this % of the 0.5/0.618 retracement, and that level within this % of a prior pivot
    swingLookbackHours: 96 # how much price history to pull for pivot/indicator calculation

    # --- trend context filter (don't fight the trend) ---
    # A 50-period SMA on hourly candles is a ~2-day lookback -- too slow to
    # react to a meme coin's actual recent structure. 20 periods (~20h) tracks
    # it much more responsively while still refusing to buy a real downtrend.
    trendSmaPeriod: 20
    chopLookbackPeriods: 15 # window to count MA crossings in
    chopMaxCrossings: 6 # this many crossings in the window means "too choppy," skip -- meme coins whipsaw more than a stricter threshold assumes

    # --- momentum confirmation (buy the reaction, not the touch) ---
    rsiPeriod: 14
    rsiMidline: 60 # RSI must be below this and rising
    rsiOverboughtCeiling: 78 # RSI above this means chasing, not catching a pullback

    # --- volume confirmation on the reaction candle ---
    volumeAvgPeriod: 15
    volumeConfirmationMultiplier: 1.2

    # --- on-chain confluence (optional, non-blocking) ---
    minBuyUsd: 5000
    maxBuyPctOfLiquidity: 3 # buys above this % of pool liquidity are treated as manipulation risk, not conviction
    minWalletAgeDays: 14
    minWalletPriorTrades: 1 # "prior trade history" -- at least this many txs found in the wallet's own history
    confirmationWindowHours: 4
    minConfirmingWallets: 2 # one whale alone doesn't count as confluence either

    # --- ATR-based stop ---
    atrPeriod: 14
    stopAtrMultiplier: 1 # initial stop = swing low - (this x ATR)

    # --- scaled take-profit ---
    extensionRatio1: 1.272
    extensionRatio2: 1.618
    scaleOutPct1: 33 # closed at extensionRatio1
    scaleOutPct2: 33 # closed at extensionRatio2 -- remainder (34%) is the uncapped runner

    # --- time-based exit (unscaled portion only -- ignored once scaleOutPct1 has fired) ---
    timeExitHours: 48

    # Pinned tokens are few enough that hourly technical scans cost nothing
    # meaningful against the Birdeye budget -- keep them responsive.
    technicalRefreshIntervalMinutes: 60

  - symbol: WIF
    address: EKpQGSJtjMFqKZ9KQanSqYXRcF8fBopzLHYxdM65zcjm
    enabled: true

    fibPivotWindow: 3
    goldenPocketZonePct: 2.5
    swingLookbackHours: 96

    trendSmaPeriod: 20
    chopLookbackPeriods: 15
    chopMaxCrossings: 6

    rsiPeriod: 14
    rsiMidline: 60
    rsiOverboughtCeiling: 78

    volumeAvgPeriod: 15
    volumeConfirmationMultiplier: 1.2

    minBuyUsd: 5000
    maxBuyPctOfLiquidity: 3
    minWalletAgeDays: 14
    minWalletPriorTrades: 1
    confirmationWindowHours: 4
    minConfirmingWallets: 2

    atrPeriod: 14
    stopAtrMultiplier: 1

    extensionRatio1: 1.272
    extensionRatio2: 1.618
    scaleOutPct1: 33
    scaleOutPct2: 33

    timeExitHours: 48
    technicalRefreshIntervalMinutes: 60

# Account-level risk management -- applies across all tokens/positions.
# No cap on concurrent open positions by design.
risk:
  riskPctPerTrade: 1 # % of account risked per trade; position size = (account x this%) / (entry - stop)
  maxPositionSizePct: 10 # hard ceiling on any single position, regardless of stop distance
  dailyLossLimitPct: 3 # halt new entries for the rest of the UTC day
  weeklyLossLimitPct: 8 # halt entirely -- sticky, no auto-resume, needs manual review
  consecutiveLossLimit: 4 # halt entirely after this many losses in a row -- sticky, no auto-resume
